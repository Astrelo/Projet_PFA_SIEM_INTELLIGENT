# ===========================================
# Configuration pmacctd
# Capture flux réseau en mode promiscuous
# ===========================================

# Interface réseau à surveiller
interface: ens33

# Plugin de sortie CSV
plugins: print[default_print]

# Format de sortie
print_output: csv
print_output_file: /tmp/pmacct_flows.csv
print_refresh_time: 10

# Features capturées
aggregate: src_host, dst_host, src_port, dst_port, proto, tos

# Mode promiscuous — capture tout le trafic
promisc: true
